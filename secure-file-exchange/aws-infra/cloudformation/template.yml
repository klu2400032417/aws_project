AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Secure Partner File Exchange Platform - Production Architecture Stack
  Includes AWS Transfer Family (Planned Target Gateway), S3 Bucket, Lambda Validation,
  DynamoDB Tables, and CloudWatch Alarms.
  NOTE: AWS Transfer Family is marked as 'Target Production Integration' due to
  AWS Learner Lab sandbox boundary constraints.

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
  StorageBucketName:
    Type: String
    Default: secure-partner-file-exchange-storage
  NotificationEmail:
    Type: String
    Default: security-ops@example.com

Resources:
  # =========================================================================
  # 1. Amazon S3 Bucket with Scoped Partition Prefixes
  # =========================================================================
  PartnerStorageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref StorageBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: 's3:ObjectCreated:*'
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: partner/
            Function: !GetAtt FileValidationLambda.Arn

  # =========================================================================
  # 2. AWS Transfer Family SFTP Server (TARGET PRODUCTION GATEWAY)
  # =========================================================================
  TransferFamilySFTPServer:
    Type: AWS::Transfer::Server
    Properties:
      IdentityProviderType: SERVICE_MANAGED
      EndpointType: PUBLIC
      Protocols:
        - SFTP
      LoggingRole: !GetAtt TransferLoggingRole.Arn
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-partner-sftp-server'
        - Key: IntegrationStatus
          Value: PlannedProduction

  TransferLoggingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: transfer.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSTransferLoggingAccess

  # =========================================================================
  # 3. Amazon DynamoDB Tables
  # =========================================================================
  TransfersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: PartnerFileTransfers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: transferId
          AttributeType: S
        - AttributeName: sha256Hash
          AttributeType: S
      KeySchema:
        - AttributeName: transferId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: Sha256Index
          KeySchema:
            - AttributeName: sha256Hash
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  PartnersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Partners
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: partnerId
          AttributeType: S
      KeySchema:
        - AttributeName: partnerId
          KeyType: HASH

  SecurityEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SecurityEvents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH

  # =========================================================================
  # 4. Amazon SNS Security Alarm Topic
  # =========================================================================
  SecurityAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${Environment}-partner-security-alarms'
      Subscription:
        - Endpoint: !Ref NotificationEmail
          Protocol: email

  # =========================================================================
  # 5. AWS Lambda Validation Function
  # =========================================================================
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3AndDynamoAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub 'arn:aws:s3:::${StorageBucketName}/*'
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:GetItem
                Resource:
                  - !GetAtt TransfersTable.Arn
                  - !Sub '${TransfersTable.Arn}/index/*'
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref SecurityAlarmTopic
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  FileValidationLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Environment}-partner-file-validator'
      Runtime: python3.11
      Handler: lambda_function.lambda_handler
      Timeout: 60
      MemorySize: 512
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          DYNAMO_TABLE: !Ref TransfersTable
          SNS_ALERT_TOPIC_ARN: !Ref SecurityAlarmTopic
          CLOUDWATCH_NAMESPACE: 'SecureFileExchange/Production'
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 200, "body": "Validation Active"}

  LambdaS3Permission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: 'lambda:InvokeFunction'
      FunctionName: !GetAtt FileValidationLambda.Arn
      Principal: s3.amazonaws.com
      SourceArn: !Sub 'arn:aws:s3:::${StorageBucketName}'

Outputs:
  StorageBucketArn:
    Value: !GetAtt PartnerStorageBucket.Arn
  SFTPServerId:
    Value: !GetAtt TransferFamilySFTPServer.ServerId
  DynamoTransfersTable:
    Value: !Ref TransfersTable
