server:
  port: 8080

spring:
  application:
    name: secure-partner-file-exchange
  datasource:
    url: jdbc:h2:file:./data/partnersdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 105MB

aws:
  region: ${AWS_REGION:us-east-1}
  s3:
    bucket-name: ${S3_BUCKET_NAME:}
    create-bucket-if-missing: true
  cloudwatch:
    namespace: ${CLOUDWATCH_NAMESPACE:SecureFileExchange}
  transfer-family:
    status: OPTIONAL_NOT_CONFIGURED
    note: "The application accepts REST uploads. Provision AWS Transfer Family separately if SFTP ingress is required."

app:
  environment: ${APP_ENV:local}
  storage:
    local-root: "./data/storage"
  security:
    max-file-size-mb: 50
    restricted-extensions: [".exe", ".bat", ".cmd", ".sh", ".vbs", ".scr", ".dll", ".ps1", ".jar", ".app"]
    allowed-default-extensions: [".csv", ".json", ".xml", ".pdf", ".txt", ".xlsx", ".pgp", ".zip"]

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
